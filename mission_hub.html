<!DOCTYPE html>
<html lang="en">
<head>
  <!--page setup-->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--css link to mission hub css-->
  <link rel="stylesheet" href="css/mission_hub.css" />
  <!--title of page-->
  <title>Mission Hub</title>
</head>
<!--logo for header-->
<body class="mission-page">
  <header class="site-header">
    <img src="assets/images/Logo.png" alt="Data Education in Schools Logo" class="site-logo">
  </header>
  <!--navbar-->
      <nav class="main-nav">
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="mission_hub.html">Missions</a>
        <a href="accessibility.html">Accessibility</a>
    </div>
    </nav>
    <!--mission selection with 7 buttons-->
  <main class="hub-wrap">
    <h1 id="welcome-message" class="hub-title"></h1>

    <nav class="mission-steps" aria-label="Mission steps">
      <button class="step active" type="button">1</button>
      <button class="step" type="button">2</button>
      <button class="step" type="button">3</button>
      <button class="step" type="button">4</button>
      <button class="step" type="button">5</button>
      <button class="step" type="button">6</button>
      <button class="step" type="button">7</button>
    </nav>

  <section class="mission-grid" aria-label="Mission selection">
    <!--classes containing each mission plus images of mission-->
    <article class="mission-card-tile" data-mission="1">
      <img src="assets/images/emoji_challenge.png" alt="Mission 1 image">
      <div class="mission-overlay">
        <h2>Mission 1</h2>
        <a class="read-more" href="emoji_puzzle.html" role="button">Begin Mission</a>
      </div>
      <div class="lock-overlay hidden">
        <!--locks mission until mission is completed-->
        <img src="assets/images/lock.png" alt="Locked mission" class="lock-icon">
        <p>Locked</p>
      </div>
    </article>

    <article class="mission-card-tile" data-mission="2">
      <img src="assets/images/binary_decryption.png" alt="Mission 2 image">
      <div class="mission-overlay">
        <h2>Mission 2</h2>
        <a class="read-more" href="binary_message.html" role="button">Begin Mission</a>
      </div>
      <div class="lock-overlay hidden">
        <img src="assets/images/lock.png" alt="Locked mission" class="lock-icon">
        <p>Locked</p>
      </div>
    </article>

    <article class="mission-card-tile" data-mission="3">
      <img src="assets/images/mission3.png" alt="Mission 3 image">
      <div class="mission-overlay">
        <h2>Mission 3</h2>
        <a class="read-more" href="caesar_test.html" role="button">Begin Mission</a>
      </div>
      <div class="lock-overlay hidden">
        <img src="assets/images/lock.png" alt="Locked mission" class="lock-icon">
        <p>Locked</p>
      </div>
    </article>

    <article class="mission-card-tile" data-mission="4">
      <img src="assets/images/rocket_launch.jpg" alt="Mission 4 image">
      <div class="mission-overlay">
        <h2>Mission 4</h2>
        <a class="read-more" href="puzzle_rocket_fuel.html" role="button">Begin Mission</a>
      </div>
      <div class="lock-overlay hidden">
        <img src="assets/images/lock.png" alt="Locked mission" class="lock-icon">
        <p>Locked</p>
      </div>
    </article>

    <article class="mission-card-tile" data-mission="5">
      <img src="assets/images/satellite.jpg" alt="Mission 5 image">
      <div class="mission-overlay">
        <h2>Mission 5</h2>
        <a class="read-more" href="puzzle_align_radar.html" role="button">Begin Mission</a>
      </div>
      <div class="lock-overlay hidden">
        <img src="assets/images/lock.png" alt="Locked mission" class="lock-icon">
        <p>Locked</p>
      </div>
    </article>

    <article class="mission-card-tile" data-mission="6">
      <img src="assets/images/firewall.png" alt="Mission 6 image">
      <div class="mission-overlay">
        <h2>Mission 6</h2>
        <a class="read-more" href="password_puzzle.html" role="button">Begin Mission</a>
      </div>
      <div class="lock-overlay hidden">
        <img src="assets/images/lock.png" alt="Locked mission" class="lock-icon">
        <p>Locked</p>
      </div>
    </article>

    <article class="mission-card-tile" data-mission="7">
      <img src="assets/images/mission7.png" alt="Mission 7 image">
      <div class="mission-overlay">
        <h2>Mission 7</h2>
        <a class="read-more" href="Puzzle_7.html" role="button">Begin Mission</a>
      </div>
      <div class="lock-overlay hidden">
        <img src="assets/images/lock.png" alt="Locked mission" class="lock-icon">
        <p>Locked</p>
      </div>
    </article>

  </section>
  <!--major x speech when entering mission hub-->
  </main>
    <div id="majorx-modal" class="dialogue-modal hidden">
    <div class="dialogue-box">
      <div class="dialogue-left">
        <img src="assets/images/major-x.png" alt="Major X" class="dialogue-majorx">
      </div>
      <!--dialogue next to major x-->
      <div class="dialogue-right">
        <h2>Major X</h2>
        <p id="dialogue-text"></p>
        <button id="dialogue-next-btn" type="button">Next</button>
      </div>
    </div>
  </div>
