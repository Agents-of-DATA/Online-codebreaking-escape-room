<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessibility Settings</title>
  <link rel="stylesheet" href="css/accessibility.css" />
</head>
<body>
  <nav class="main-nav">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="mission_hub.html">Missions</a>
      <a href="accessibility.html" class="active">Accessibility</a>
    </div>
  </nav>

  <main class="page-wrap">
    <section class="accessibility-card">
      <h1>Accessibility Settings</h1>
      <h2>Major-x's accessibility modifier.</h2>
      <p>Feel free to upgrade your settings to make sure your agent skills are fully unlocked</p>

      <div class="control-group">
        <label for="textSize">Text Size: <span id="textSizeValue">100%</span></label>
        <input type="range" id="textSize" min="80" max="160" value="100" />
      </div>

      <div class="control-group">
        <label for="fontSelect">Font Style</label>
        <select id="fontSelect">
          <option value="Arial, sans-serif">Arial</option>
          <option value="'Verdana', sans-serif">Verdana</option>
          <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
          <option value="'Georgia', serif">Georgia</option>
          <option value="'Courier New', monospace">Courier New</option>
        </select>
      </div>

      <div class="control-group">
        <label for="colourBlindMode">Colour Blind Mode</label>
        <select id="colourBlindMode">
          <option value="none">None</option>
          <option value="protanopia">Protanopia</option>
          <option value="deuteranopia">Deuteranopia</option>
          <option value="tritanopia">Tritanopia</option>
          <option value="grayscale">Grayscale</option>
        </select>
      </div>

      <div class="control-group">
        <label for="contrast">Contrast: <span id="contrastValue">100%</span></label>
        <input type="range" id="contrast" min="50" max="200" value="100" />
      </div>

      <div class="control-group">
        <label for="saturation">Saturation: <span id="saturationValue">100%</span></label>
        <input type="range" id="saturation" min="0" max="200" value="100" />
      </div>

      <div class="button-row">
        <button id="saveSettings">Save Settings</button>
        <button id="resetSettings" type="button">Reset</button>
      </div>
    </section>
  </main>

  <script src="js/accessibility.js"></script>
</body>
</html>
