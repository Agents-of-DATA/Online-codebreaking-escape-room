<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Complete - Certificate</title>
  <link rel="stylesheet" href="css/mission_complete.css">
</head>
<body>
  <div class="page-wrap">
    <div class="certificate-wrapper">
      <div class="certificate">
        <img src="assets/images/certificate.png" class="certificate-bg" alt="Certificate">

        <div class="certificate-overlay">
          <img id="agentAvatarImg" class="certificate-avatar" src="" alt="Agent Avatar">
          <p class="agent-name">Agent <span id="agentName"></span></p>
        </div>
      </div>

      <div class="buttons">
        <button class="btn-print" onclick="window.print()">Print Certificate</button>
        <button class="btn-home" onclick="window.location.href='index.html'">Return Home</button>
      </div>
    </div>
  </div>

  <script src="js/accessibility.js"></script>
  <script>
    const agentName = sessionStorage.getItem("agentName");
    document.getElementById("agentName").textContent = agentName || "Unknown Agent";

    const avatar = sessionStorage.getItem("agentAvatar");
    if (avatar) {
      document.getElementById("agentAvatarImg").src = "assets/images/" + avatar;
    }
  </script>
</body>
</html>
