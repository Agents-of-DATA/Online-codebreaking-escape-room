<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/avatar.css" />
    <title>Choose Your Agent</title>
  </head>

  <body class="avatar-page">
    <nav class="main-nav">
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="mission_hub.html">Missions</a>
        <a href="accessibility.html">Accessibility</a>
      </div>
    </nav>
    <header class="site-header">
      <img
        src="assets/images/Logo.png"
        alt="Data Education in Schools Logo"
        class="site-logo"
      />
    </header>

    <main class="landing-wrap">
      <section class="mission-card avatar-card" aria-label="Avatar selection">
        <div class="briefing">
          <h1 class="briefing-title">Choose your Agent Avatar</h1>
          <p>Select one avatar to represent you in the mission.</p>

          <div class="avatar-grid" id="avatar-grid">
            <button
              class="avatar-option"
              type="button"
              data-avatar="agent1.png"
            >
              <img src="assets/images/agent1.png" alt="Agent avatar 1" />
            </button>
            <button
              class="avatar-option"
              type="button"
              data-avatar="agent2.png"
            >
              <img src="assets/images/agent2.png" alt="Agent avatar 2" />
            </button>
            <button
              class="avatar-option"
              type="button"
              data-avatar="agent3.png"
            >
              <img src="assets/images/agent3.png" alt="Agent avatar 3" />
            </button>
            <button
              class="avatar-option"
              type="button"
              data-avatar="agent4.png"
            >
              <img src="assets/images/agent4.png" alt="Agent avatar 4" />
            </button>
            <button
              class="avatar-option"
              type="button"
              data-avatar="agent5.png"
            >
              <img src="assets/images/agent5.png" alt="Agent avatar 5" />
            </button>
            <button
              class="avatar-option"
              type="button"
              data-avatar="agent6.png"
            >
              <img src="assets/images/agent6.png" alt="Agent avatar 6" />
            </button>
            <button
              class="avatar-option"
              type="button"
              data-avatar="agent7.png"
            >
              <img src="assets/images/agent7.png" alt="Agent avatar 7" />
            </button>
            <button
              class="avatar-option"
              type="button"
              data-avatar="agent8.png"
            >
              <img src="assets/images/agent8.png" alt="Agent avatar 8" />
            </button>
            <button
              class="avatar-option"
              type="button"
              data-avatar="agent9.png"
            >
              <img src="assets/images/agent9.png" alt="Agent avatar 9" />
            </button>
            <button
              class="avatar-option"
              type="button"
              data-avatar="agent10.png"
            >
              <img src="assets/images/agent10.png" alt="Agent avatar 10" />
            </button>
            <button
              class="avatar-option"
              type="button"
              data-avatar="agent11.png"
            >
              <img src="assets/images/agent11.png" alt="Agent avatar 11" />
            </button>
            <button
              class="avatar-option"
              type="button"
              data-avatar="agent12.png"
            >
              <img src="assets/images/agent12.png" alt="Agent avatar 12" />
            </button>
          </div>

          <div class="start-row">
            <button id="continue-btn" type="button" disabled>Continue</button>
          </div>
        </div>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
