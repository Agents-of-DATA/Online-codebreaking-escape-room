<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/emoji_puzzle.css">
  <title>Emoji Puzzle</title>
</head>

<body>

  <!-- Header section with mission title and page navigation -->
  <header class="mission-header">
    <h1>Agents of DATA</h1>
    <h2>System 1</h2>
    <!-- Link to return to the mission hub -->
    <a href="mission_hub.html" class="back-link"> Back to Mission Hub</a>
  </header>

  <!-- Main mission area -->
  <section class="mission-panel">

    <div class="container">
      <!-- Agent breif section explaining the puzzle -->
      <div class="puzzle-container briefing">
        <h3>Agent K's Briefing</h3>
        <p>The VIKINGS have encrypted their message using emojis. Decode the pattern and find the correct meaning.</p>
      </div>

      <!-- Puzzle section -->
      <div class="puzzle-container">

        <!-- Table showing what letter each emoji represents -->
        <table id="emojiTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>

        <!-- Title showing the current level -->
        <h2 id="levelTitle">Level 1</h2>

        <!-- Where the emoji sentence will be display -->
        <div id="emojiDisplay"></div>

        <!-- User input and action controls -->
        <div class="controls">
          <!-- Input for users answer -->
          <input id="answerInput" type="text" placeholder="Type your answer here" />
          <!-- Button to validate the users answer using the function -->
          <button onclick="checkAnswer()">Check Answer</button>
        </div>

        <!-- Area to display if user got it right or wrong -->
        <div id="result"></div>

      </div>

    </div>
  </section>

  <script src="js/emoji_puzzle.js"></script>

</body>
</html>
