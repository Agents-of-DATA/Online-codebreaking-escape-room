<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binary Message</title>
  <link rel="stylesheet" href="css/binary_chart.css">




</head>

<body>
  <div class="content">
    <!-- Binary decoder challenge content -->
    <h1>Binary Decoder Challenge</h1>

    
      <!-- binary place value table to help users understand how binary works -->
      <div class="binary_table">
        <h2>Binary Helper Table</h2>
        <p>Use the top row to work out each binary number.</p>

          <table>
            <tr>
              <th>Decimal</th>
              <th>8</th>
              <th>4</th>
              <th>2</th>
              <th>1</th>
              <th>Binary</th>
            </tr>
            <tr><td>1</td><td>0</td><td>0</td><td>0</td><td>1</td><td>0001</td></tr>
            <tr><td>2</td><td>0</td><td>0</td><td>1</td><td>0</td><td>0010</td></tr>
            <tr><td>3</td><td>0</td><td>0</td><td>1</td><td>1</td><td>0011</td></tr>
            <tr><td>4</td><td>0</td><td>1</td><td>0</td><td>0</td><td>0100</td></tr>
            <tr><td>5</td><td>0</td><td>1</td><td>0</td><td>1</td><td>0101</td></tr>
            <tr><td>6</td><td>0</td><td>1</td><td>1</td><td>0</td><td>0110</td></tr>
            <tr><td>7</td><td>0</td><td>1</td><td>1</td><td>1</td><td>0111</td></tr>
            <tr><td>8</td><td>1</td><td>0</td><td>0</td><td>0</td><td>1000</td></tr>
            <tr><td>9</td><td>1</td><td>0</td><td>0</td><td>1</td><td>1001</td></tr>
            <tr><td>10</td><td>1</td><td>0</td><td>1</td><td>0</td><td>1010</td></tr>
            <tr><td>11</td><td>1</td><td>0</td><td>1</td><td>1</td><td>1011</td></tr>
            <tr><td>12</td><td>1</td><td>1</td><td>0</td><td>0</td><td>1100</td></tr>
            <tr><td>13</td><td>1</td><td>1</td><td>0</td><td>1</td><td>1101</td></tr>
            <tr><td>14</td><td>1</td><td>1</td><td>1</td><td>0</td><td>1110</td></tr>
            <tr><td>15</td><td>1</td><td>1</td><td>1</td><td>1</td><td>1111</td></tr>
          </table>
        </div>

    <!-- binary chart controls and message -->
    <div id="binary_controls">
      <div id="binary_message"></div>

      <input type="text" id="binary_input" placeholder="Enter decimal number">
      <button id="answer_btn">Submit Answer</button>

      <!-- Feedback container -->
      <div id="word_feedback"></div>
    </div>
  </div>

  <script src="js/binary.js"></script>
  <script src="js/accessibility.js"></script>
</body>
</html>
