<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher Challenge</title>
    <link rel="stylesheet" href="css/binary_chart.css">
</head>
<body>
    <div class="content">
        <h1>Caesar Cipher Challenge</h1>
        <p>Use the Caesar wheel below to decode the message. Shift the letters in the opposite direction shown to find the original word.</p>


        <!-- Main content area -->

        <!-- Caesar challenge elements (shown only on question page) -->
        <div id="caesar_controls">
            <h3>Decode the Caesar Cipher:</h3>
            <input type="text" id="caesar_input" placeholder="Type your guess here">
            <button id="submit_btn">Submit Answer</button>
            <div id="word_feedback"></div>
            <!-- Reference image -->
            <img src="./assets/images/caesar_wheel.png" alt="Caesar cipher alphabet wheel" class="binary caesar-wheel">
            <!-- Display boxes for encoded word, shift, and direction -->
            <div class="display-box">
                <label>Encoded Word:</label>
                <input type="text" id="encoded_input" readonly>
            </div>
            <div class="display-box">
                <label>Shift:</label>
                <input type="text" id="shift" readonly>
            </div>
            
            <div class="display-box">
                <label>Direction (shift the opposite way):</label>
                <input type="text" id="direction" readonly>
            </div>
            
        </div>
    </div>

    <script src="js/caesar_shifter.js"></script>
    <script src="js/accessibility.js"></script>
</body>
</html>
